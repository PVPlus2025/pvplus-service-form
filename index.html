<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PV+ Service Form</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#eef3f8;
    margin:0;
    padding:0;
}

.header{
    background:linear-gradient(90deg,#0f3b70,#1496b8);
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    max-width:900px;
    margin:20px auto;
    background:white;
    padding:25px;
    border-radius:14px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

input,textarea,select{
    width:100%;
    padding:12px;
    margin-bottom:16px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
    box-sizing:border-box;
}

button{
    background:#16a34a;
    color:white;
    border:none;
    padding:14px 20px;
    border-radius:8px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.finding{
    border:1px solid #dbe3ea;
    border-radius:10px;
    padding:15px;
    margin-bottom:15px;
    background:#f9fbfd;
}

.success{
    background:#dcfce7;
    color:#166534;
    padding:15px;
    border-radius:10px;
    margin-top:20px;
    display:none;
}
</style>
</head>
<body>

<div class="header">
<h1>PV+ Solar Health Report</h1>
<p>Field Inspection & Service System</p>
</div>

<div class="container">

<label>Customer</label>
<input id="customer">

<label>Address</label>
</html>
